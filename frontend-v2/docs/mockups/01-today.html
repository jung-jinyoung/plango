<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plango · 오늘</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --surface-page:#F7F8FA; --surface-card:#FFF; --surface-sunken:#F2F4F6; --border:#E5E8EB;
  --text-primary:#191F28; --text-secondary:#6B7684; --text-muted:#8B95A1;
  --rose-50:#FFF0F4; --rose-500:#FF4E7E; --rose-600:#F5326A; --rose-700:#C81E52;
  --cat-blue:#3182F6; --cat-mint:#00BFA5; --cat-amber:#FFA218;
  --elev-hover:0 1px 3px rgba(0,0,0,.06);
  --hour:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
  background:var(--surface-page); color:var(--text-primary);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- header ---------- */
.top{
  height:64px; background:var(--surface-card); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:16px; padding:0 24px;
  position:sticky; top:0; z-index:20;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.today-label{font-weight:600;font-size:15px}
.today-sub{color:var(--text-muted);font-size:13px;margin-left:6px}
.spacer{flex:1}
.btn-primary{
  background:var(--rose-500); color:#fff; font-weight:600; font-size:14px;
  padding:10px 20px; border-radius:8px; transition:background .15s;
}
.btn-primary:hover{background:var(--rose-600)}
.btn-ghost{
  color:var(--text-secondary); font-weight:500; padding:10px 14px; border-radius:8px;
}
.btn-ghost:hover{background:var(--surface-sunken)}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:264px 1fr 312px;gap:16px;padding:16px 24px;align-items:start}
.panel{background:var(--surface-card);border-radius:16px;padding:20px}
.panel-h{font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:14px;letter-spacing:-.01em}

/* ---------- sidebar ---------- */
.goal-month{padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:18px}
.goal-title{font-weight:600;font-size:15px;margin-bottom:10px}
.bar{height:6px;background:var(--surface-sunken);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.goal-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.wgoal{margin-bottom:16px}
.wgoal:last-child{margin-bottom:0}
.wgoal-top{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.dot{width:7px;height:7px;border-radius:99px;flex:none}
.wgoal-name{font-weight:500;font-size:13.5px;flex:1}
.wgoal-num{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.done .wgoal-name{color:var(--text-muted)}

/* ---------- carry banner ---------- */
.carry{
  background:var(--surface-card); border-radius:16px; padding:14px 18px;
  display:flex;align-items:center;gap:12px;margin-bottom:12px;
}
.carry p{flex:1;font-size:13.5px}
.carry .link{font-weight:600;color:var(--text-secondary);padding:7px 12px;border-radius:8px;font-size:13px}
.carry .link:hover{background:var(--surface-sunken)}
.carry .accept{color:var(--rose-700);background:var(--rose-50)}

/* ---------- timeline ---------- */
.tl{position:relative;padding:4px 0 4px 56px}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--border)}
.hr span{position:absolute;left:0;top:-8px;font-size:11.5px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.lane{position:absolute;left:56px;right:8px}

.blk{
  position:absolute;left:0;right:0;border-radius:6px;padding:6px 10px;overflow:hidden;
}
.blk b{display:block;font-weight:600;font-size:13px;line-height:1.35}
.blk small{font-size:11.5px;opacity:.72;font-variant-numeric:tabular-nums}
.blk.appt{background:var(--surface-sunken);color:var(--text-secondary)}

.pair{position:absolute;left:0;right:0;display:flex;gap:6px}
.pair .ghost{
  width:38%;border:1px dashed #C9CED6;border-radius:6px;background:transparent;
  padding:6px 8px;color:var(--text-muted);
}
.pair .ghost b{font-weight:500;font-size:11.5px;color:var(--text-muted)}
.pair .real{flex:1;position:relative;border-radius:6px;padding:6px 10px}
.delta{font-size:11px;font-weight:600;margin-top:2px;display:inline-block}

.now{position:absolute;left:0;right:0;height:0;z-index:8}
.now:before{content:"";position:absolute;left:56px;right:0;top:0;border-top:2px solid var(--rose-500)}
.now .flam{position:absolute;left:30px;top:-13px}
.now .time{
  position:absolute;left:0;top:-9px;font-size:11px;font-weight:700;color:var(--rose-600);
  font-variant-numeric:tabular-nums;
}

/* ---------- inbox ---------- */
.input-box{background:var(--surface-sunken);border-radius:10px;padding:11px 13px;font-size:14px}
.input-box .caret{border-left:1.5px solid var(--text-primary);margin-left:1px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.preview{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--surface-sunken);color:var(--text-secondary);font-weight:500}
.chip.on{background:#E8F1FE;color:#1B5FBF}
.chip.tm{background:#EAF6F4;color:#00806E;font-variant-numeric:tabular-nums}
.inbox-item{
  display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:10px;
  background:var(--surface-card);border:1px solid var(--border);margin-top:8px;
}
.inbox-item:hover{box-shadow:var(--elev-hover)}
.inbox-item span{flex:1;font-size:13.5px}
.inbox-item em{font-style:normal;font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.btn-sub{
  width:100%;margin-top:14px;padding:11px;border-radius:10px;background:var(--surface-sunken);
  font-weight:600;font-size:13.5px;color:var(--text-secondary);
}
.btn-sub:hover{background:#EAEDF0}
.legend{display:flex;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);flex-wrap:wrap}
.legend i{display:flex;align-items:center;gap:6px;font-style:normal;font-size:11.5px;color:var(--text-muted)}
.sw{width:14px;height:10px;border-radius:3px;flex:none}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg width="18" height="22" viewBox="0 0 18 22" fill="none" aria-hidden="true">
      <ellipse cx="8" cy="14.5" rx="6.2" ry="4.4" fill="#FF4E7E"/>
      <path d="M12 12.4C15.2 9.6 15 5 11.6 3.6" stroke="#FF4E7E" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="10.9" cy="3" r="2.1" fill="#FF4E7E"/>
      <path d="M12.6 2.1L16 3.4L12.6 4.4Z" fill="#FF4E7E"/>
      <path d="M6.6 18.6L7.7 20.4L6 21.9" stroke="#FF4E7E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Plango
  </div>
  <div>
    <span class="today-label">오늘</span>
    <span class="today-sub">7월 29일 수요일</span>
  </div>
  <div class="spacer"></div>
  <button class="btn-ghost">이번 주</button>
  <button class="btn-primary">오늘 확정</button>
</header>

<div class="wrap">

  <!-- ============ 사이드 ============ -->
  <aside class="panel">
    <div class="goal-month">
      <div class="panel-h">이번 달 목표</div>
      <div class="goal-title">논문 초고 완성</div>
      <div class="bar"><i style="width:45%;background:var(--cat-blue)"></i></div>
      <div class="goal-meta"><span>18시간 썼어요</span><span>40시간 예상</span></div>
    </div>

    <div class="panel-h">이번 주 목표</div>

    <div class="wgoal">
      <div class="wgoal-top">
        <span class="dot" style="background:var(--cat-blue)"></span>
        <span class="wgoal-name">결과 파트 작성</span>
        <span class="wgoal-num">3 / 10h</span>
      </div>
      <div class="bar"><i style="width:30%;background:var(--cat-blue)"></i></div>
    </div>

    <div class="wgoal done">
      <div class="wgoal-top">
        <span class="dot" style="background:var(--cat-blue)"></span>
        <span class="wgoal-name">선행연구 정리</span>
        <span class="wgoal-num">6 / 6h</span>
      </div>
      <div class="bar"><i style="width:100%;background:#B7D3FB"></i></div>
    </div>

    <div class="wgoal">
      <div class="wgoal-top">
        <span class="dot" style="background:var(--cat-mint)"></span>
        <span class="wgoal-name">운동 습관 잡기</span>
        <span class="wgoal-num">90 / 180분</span>
      </div>
      <div class="bar"><i style="width:50%;background:var(--cat-mint)"></i></div>
    </div>
  </aside>

  <!-- ============ 타임라인 ============ -->
  <main>
    <div class="carry">
      <p><b style="font-weight:600">어제 못 한 일 2개</b>가 기다리고 있어요. 오늘로 옮길까요?</p>
      <button class="link">나중에</button>
      <button class="link accept">오늘로 옮기기</button>
    </div>

    <section class="panel" style="padding:20px 20px 8px">
      <div class="tl" id="tl" style="height:832px">
        <!-- 시간선 · 블록은 스크립트로 배치 -->
      </div>
    </section>
  </main>

  <!-- ============ 인박스 ============ -->
  <aside class="panel">
    <div class="panel-h">할 일 적기</div>
    <div class="input-box">논문 서론 초안 90m #결과<span class="caret">&nbsp;</span></div>
    <div class="preview">
      <span class="chip">논문 서론 초안</span>
      <span class="chip tm">90분</span>
      <span class="chip on"># 결과 파트 작성</span>
    </div>

    <div class="panel-h" style="margin:22px 0 0">아직 안 놓은 일 2</div>
    <div class="inbox-item"><span class="dot" style="background:var(--cat-blue)"></span><span>참고문헌 정리</span><em>40분</em></div>
    <div class="inbox-item"><span class="dot" style="background:var(--text-muted)"></span><span>택배 부치기</span><em>20분</em></div>
    <button class="btn-sub">비어 있는 시간에 놓기</button>

    <div class="legend">
      <i><span class="sw" style="background:#DEEBFE"></span>목표에 연결된 할 일</i>
      <i><span class="sw" style="background:var(--surface-sunken)"></span>약속</i>
      <i><span class="sw" style="border:1px dashed #C9CED6"></span>원래 계획</i>
    </div>
  </aside>
</div>

<script>
const START = 8, END = 21, H = 64;
const cat = { blue:'#3182F6', mint:'#00BFA5', gray:'#8B95A1' };
const tint = { blue:'#DEEBFE', mint:'#D6F5F1' };
const deep = { blue:'#1B5FBF', mint:'#00806E' };
const y = t => (t - START) * H;

/* 실제로 흘러간 하루: 예상보다 길어진 작업, 그래서 밀린 뒷일 */
const items = [
  { title:'논문 결과표 초안', c:'blue', plan:[9,10],      real:[9,10.75] },
  { title:'팀 회의',         c:'gray', plan:[11,12],     real:[11,11.85], appt:true },
  { title:'그래프 3개 다듬기', c:'blue', plan:[13,14],     real:[13.15,14.25] },
  { title:'논문 서론 초안',   c:'blue', plan:[15,16.5] },
  { title:'헬스장 운동',      c:'mint', plan:[17,18] },
  { title:'저녁 약속',        c:'gray', plan:[19,20.5], appt:true }
];
const NOW = 14.55;

const tl = document.getElementById('tl');
let html = '';
for (let h = START; h <= END; h++) {
  html += `<div class="hr" style="top:${y(h)}px"><span>${String(h).padStart(2,'0')}:00</span></div>`;
}

const mins = n => Math.round(n * 60);
const fmt  = n => mins(n) >= 60 ? `${Math.floor(mins(n)/60)}시간 ${mins(n)%60 ? mins(n)%60+'분' : ''}`.trim() : `${mins(n)}분`;

items.forEach(it => {
  const [ps, pe] = it.plan;
  const planLen = pe - ps;

  if (!it.real) {                                   /* 아직 오지 않은 계획 */
    html += `<div class="lane" style="top:${y(ps)}px;height:${planLen*H}px">
      <div class="${it.appt ? 'blk appt' : 'blk'}" style="top:0;bottom:2px;${it.appt
        ? ''
        : `background:${tint[it.c]};color:${deep[it.c]}`}">
        <b>${it.title}</b><small>${fmt(planLen)} 예상</small>
      </div></div>`;
    return;
  }

  const [rs, re] = it.real;
  const realLen  = re - rs;
  const gap      = Math.abs(mins(realLen) - mins(planLen));

  if (gap < 15) {                                   /* 계획대로 흘러감 → 한 덩어리 */
    html += `<div class="lane" style="top:${y(rs)}px;height:${realLen*H}px">
      <div class="${it.appt ? 'blk appt' : 'blk'}" style="top:0;bottom:2px;${it.appt
        ? ''
        : `background:${tint[it.c]};color:${deep[it.c]}`}">
        <b>${it.title}</b><small>${fmt(realLen)}</small>
      </div></div>`;
    return;
  }

  /* 15분 이상 어긋남 → 계획 고스트와 실제를 나란히 */
  const top = Math.min(y(ps), y(rs));
  const bot = Math.max(y(pe), y(re));
  html += `<div class="lane" style="top:${top}px;height:${bot-top}px">
    <div class="pair" style="top:0;bottom:2px">
      <div class="ghost" style="height:${planLen*H - 2}px;margin-top:${y(ps)-top}px">
        <b>계획</b><small>${fmt(planLen)}</small>
      </div>
      <div class="real" style="height:${realLen*H - 2}px;margin-top:${y(rs)-top}px;${it.appt
        ? 'background:var(--surface-sunken);color:var(--text-secondary)'
        : `background:${tint[it.c]};color:${deep[it.c]}`}">
        <b>${it.title}</b><small>${fmt(realLen)}</small>
        <span class="delta">+${gap}분</span>
      </div>
    </div></div>`;
});

html += `<div class="now" style="top:${y(NOW)}px">
  <span class="time">14:33</span>
  <svg class="flam" width="17" height="21" viewBox="0 0 18 22" fill="none" aria-label="지금">
    <ellipse cx="8" cy="14.5" rx="6.2" ry="4.4" fill="#FF4E7E"/>
    <path d="M12 12.4C15.2 9.6 15 5 11.6 3.6" stroke="#FF4E7E" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="10.9" cy="3" r="2.1" fill="#FF4E7E"/>
    <path d="M12.6 2.1L16 3.4L12.6 4.4Z" fill="#FF4E7E"/>
    <path d="M6.6 18.6L7.7 20.4L6 21.9" stroke="#FF4E7E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>`;

tl.innerHTML = html;
</script>
</body>
</html>
